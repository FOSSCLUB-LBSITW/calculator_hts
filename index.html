<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" href="web_Icon/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main-body">
        <div class="calc">

            <!-- Display wrapper holds both the input and the copy button -->
            <div class="display-wrapper">
                <input type="text" placeholder="0" id="inputBox">
                <button id="copyBtn" class="copy-btn" title="Copy result" aria-label="Copy result">📋</button>
            </div>
            <div id="preview" class="preview"></div>

            <!-- Unit Converter Toggle -->
            <div class="unit-bar">
                <button id="unitToggle" class="unit-toggle-btn">⇄ Unit Converter</button>
            </div>

            <!-- Unit Converter Panel -->
            <div id="unitPanel" class="unit-panel hidden">
                <div class="unit-row">
                    <select id="unitCategory" class="unit-select">
                        <option value="length">Length</option>
                        <option value="weight">Weight</option>
                        <option value="temperature">Temperature</option>
                        <option value="area">Area</option>
                        <option value="speed">Speed</option>
                        <option value="volume">Volume</option>
                        <option value="data">Data</option>
                    </select>
                </div>
                <div class="unit-row">
                    <input type="number" id="unitInput" class="unit-input" placeholder="Enter value">
                    <select id="unitFrom" class="unit-select-small"></select>
                    <span class="unit-arrow">→</span>
                    <select id="unitTo" class="unit-select-small"></select>
                </div>
                <div id="unitResult" class="unit-result">—</div>
                <button id="unitUseResult" class="unit-use-btn">Use result in calculator</button>
            </div>
            <div class="row" style="grid-template-columns: repeat(5, 1fr);">
                <button class="operator">AC</button>
                <button class="operator">DEL</button>
                <button class="operator">%</button>
                <button class="operator">√</button>
                <button class="operator">!</button>
            </div>

            <div class="row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">/</button>
            </div>

            <div class="row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">*</button>
            </div>

            <div class="row">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">-</button>
            </div>

            <div class="row">
                <button>00</button>
                <button>0</button>
                <button>.</button>
                <button class="operator">+</button>
            </div>

            <div class="row">
                <button class="equalbtn">=</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>

</body>
